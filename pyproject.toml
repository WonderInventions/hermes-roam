[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-roam"
version = "0.0.6"
description = "Roam (ro.am) platform adapter plugin for Hermes Agent"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wonder Inventions" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/WonderInventions/hermes-roam"
Issues = "https://github.com/WonderInventions/hermes-roam/issues"

[project.entry-points."hermes_agent.plugins"]
# Point at the module, not the function — Hermes' loader does
# getattr(module, "register"), so 'roam:register' would resolve to the
# function and the lookup would fail.
roam = "roam"

[tool.setuptools]
packages = ["roam"]

[tool.setuptools.package-data]
roam = ["plugin.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
