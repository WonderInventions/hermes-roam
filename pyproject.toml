# hermes-roam is a Hermes Agent platform plugin, not a pip package. Its files
# live at the repo root so Hermes' Git-URL installer — which clones the repo
# into ~/.hermes/plugins/<name>/ and looks for plugin.yaml / __init__.py at that
# root — recognizes it. There is therefore no build-system / wheel here; the
# runtime dependency (aiohttp) is surfaced to Hermes via the adapter's
# install_hint and documented in the README. This file is kept only for project
# metadata (the release workflow reads project.version) and pytest config.

[project]
name = "hermes-roam"
version = "0.0.11"
description = "Roam (ro.am) platform adapter plugin for Hermes Agent"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wonder Inventions" }]

[project.urls]
Homepage = "https://github.com/WonderInventions/hermes-roam"
Repository = "https://github.com/WonderInventions/hermes-roam"
Issues = "https://github.com/WonderInventions/hermes-roam/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
