name: Release

on:
  push:
    tags:
      - "v*"

# No ambient permissions; the one job opts in to exactly what it needs.
permissions: {}

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub Release and upload the tarball
      id-token: write      # mint the short-lived OIDC token that signs provenance
      attestations: write  # record the build-provenance attestation for the tarball

    steps:
      # Actions are pinned to full commit SHAs (mutable tags like @v4 can be
      # re-pointed at malicious code). The trailing comment tracks the human
      # version; Dependabot bumps the SHA and the comment together.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false  # don't leave the checkout token on disk

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib,sys; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME (=$tag) does not match pyproject version $pkg" >&2
            exit 1
          fi

      - name: Run tests against the tagged commit
        run: python -m pytest -v

      - name: Build plugin tarball
        # The plugin files live at the repo root now; stage them under roam/ so
        # the tarball still extracts to ~/.hermes/plugins/roam/, matching
        # Hermes' user-plugin discovery layout (the INSTALL.md one-liner uses it).
        # The explicit cp list is the artifact allowlist: only these five files
        # ship, so .venv/.git/.env and other local junk can never leak in.
        run: |
          mkdir -p stage/roam
          cp plugin.yaml __init__.py adapter.py roam_client.py standard_webhooks.py stage/roam/
          tar -czf "hermes-roam-plugin-${GITHUB_REF_NAME}.tar.gz" -C stage roam

      - name: Attest build provenance for the tarball
        # Signs SLSA provenance linking this exact tarball to this repo, commit,
        # and workflow run. Consumers verify with:
        #   gh attestation verify <tarball> --repo WonderInventions/hermes-roam
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: "hermes-roam-plugin-${{ github.ref_name }}.tar.gz"

      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "hermes-roam-plugin-${GITHUB_REF_NAME}.tar.gz"
